<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SRIJA Visual Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef2f7;color:#172033}
#bar{position:sticky;top:0;z-index:1000;background:#173b8f;color:white;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px #0003}
#bar button,#bar label{border:0;background:white;color:#173b8f;border-radius:7px;padding:9px 11px;font-weight:700;cursor:pointer}
#bar input{width:70px;padding:8px;border-radius:7px;border:0}#file{display:none}
#status{margin-left:auto;font-size:12px}
#work{max-width:1100px;margin:16px auto;padding:18px;background:white;min-height:calc(100vh - 100px);border-radius:12px;box-shadow:0 2px 12px #0002}
.item{position:relative;margin:10px;padding:12px;border:2px solid transparent;min-height:35px;cursor:pointer;touch-action:none;user-select:text;overflow:auto}.item.box-edit{resize:both;overflow:auto;min-width:80px;min-height:50px}
.item.selected{border-color:#2457c5;outline:2px dashed #7aa0ef;outline-offset:2px}
.item[contenteditable=true]{cursor:text}
img.item{display:block;max-width:100%;height:auto}
#panel{position:fixed;right:10px;bottom:10px;z-index:1100;background:white;border:1px solid #ccd5e3;border-radius:12px;padding:10px;box-shadow:0 4px 20px #0003;display:none;max-width:95vw}
#panel.show{display:block}.row{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}.row button,.row select,.row input{padding:7px}
@media(max-width:600px){#bar{position:sticky}.item{margin:6px;padding:10px}#work{margin:6px;padding:8px}.row button{min-height:42px}}
</style></head>
<body>
<div id="bar">
<strong>SRIJA EDITOR</strong>
<button onclick="addText()">+ Text</button><button onclick="addBox()">+ Box</button><button onclick="addImage()">+ Image</button>
<button onclick="undo()">↶</button><button onclick="redo()">↷</button><button onclick="copyEl()">Copy</button><button onclick="pasteEl()">Paste</button>
<button onclick="save()">Save</button><button onclick="resetSaved()">Default</button><button onclick="goHome()">Home</button>
<label>Font <input id="fs" type="number" min="8" max="120" value="18" onchange="styleSel('fontSize',this.value+'px')"></label>
<button onclick="styleSel('fontWeight','bold')">B</button><button onclick="styleSel('fontStyle','italic')">I</button>
<button onclick="styleSel('textAlign','left')">L</button><button onclick="styleSel('textAlign','center')">C</button><button onclick="styleSel('textAlign','right')">R</button>
<label>Text <input type="color" onchange="styleSel('color',this.value)"></label><label>BG <input type="color" onchange="styleSel('backgroundColor',this.value)"></label>
<label>Upload <input id="file" type="file" accept="image/*" onchange="uploadImage(event)"></label>
<span id="status">Ready</span>
</div>
<main id="work"></main>
<div id="panel"><div class="row"><button onclick="move(-5,0)">←</button><button onclick="move(0,-5)">↑</button><button onclick="move(0,5)">↓</button><button onclick="move(5,0)">→</button><button onclick="resize(-5)">− Size</button><button onclick="resize(5)">+ Size</button><button onclick="deleteSel()">Delete</button></div><div class="row"><label>Width <input id="wd" type="number" onchange="setWidth(this.value)"></label></div></div>
<script>
const W=document.getElementById('work'),P=document.getElementById('panel'),S=document.getElementById('status');let sel=null,clip=null,undoStack=[],redoStack=[];
const KEY='srija_visual_editor_v1';
function snapshot(){undoStack.push(W.innerHTML);if(undoStack.length>40)undoStack.shift();redoStack=[]}
function bind(el){el.classList.add('item');el.addEventListener('pointerdown',e=>{if(e.target===el||el.tagName==='IMG'){select(el);if(el.tagName==='IMG')e.preventDefault()}});el.addEventListener('dblclick',()=>{if(el.tagName!=='IMG'){el.contentEditable='true';el.classList.add('box-edit');el.focus()}});el.addEventListener('input',()=>snapshot());}
function select(el){document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'));sel=el;el.classList.add('selected');P.classList.add('show');document.getElementById('wd').value=Math.round(el.getBoundingClientRect().width)}
function addText(){snapshot();let e=document.createElement('div');e.textContent='এখানে লেখা লিখুন';e.contentEditable='true';bind(e);W.appendChild(e);select(e);e.focus()}
function addBox(){snapshot();let e=document.createElement('div');e.innerHTML='<strong>নতুন বক্স</strong><div>এখানে আপনার লেখা বা তথ্য দিন</div>';e.classList.add('box-edit');e.contentEditable='true';bind(e);W.appendChild(e);select(e);e.focus()}
function addImage(){document.getElementById('file').click()}
function uploadImage(ev){let f=ev.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{snapshot();let e=document.createElement('img');e.src=rd.result;bind(e);W.appendChild(e);select(e);save()};rd.readAsDataURL(f);ev.target.value=''}
function styleSel(k,v){if(!sel)return; snapshot();sel.style[k]=v}
function move(x,y){if(!sel)return;snapshot();sel.style.transform='translate('+((parseInt(sel.dataset.x)||0)+x)+'px,'+((parseInt(sel.dataset.y)||0)+y)+'px)';sel.dataset.x=(parseInt(sel.dataset.x)||0)+x;sel.dataset.y=(parseInt(sel.dataset.y)||0)+y}
function resize(d){if(!sel)return;snapshot();let n=Math.max(30,(sel.offsetWidth||100)+d*5);sel.style.width=n+'px';document.getElementById('wd').value=n}
function setWidth(v){if(sel){snapshot();sel.style.width=v+'px'}}
function deleteSel(){if(sel){snapshot();sel.remove();sel=null;P.classList.remove('show');}}
function copyEl(){if(sel)clip=sel.cloneNode(true)}
function pasteEl(){if(!clip)return;snapshot();let e=clip.cloneNode(true);bind(e);W.appendChild(e);select(e)}
function undo(){if(!undoStack.length)return;redoStack.push(W.innerHTML);W.innerHTML=undoStack.pop();rebind()}
function redo(){if(!redoStack.length)return;undoStack.push(W.innerHTML);W.innerHTML=redoStack.pop();rebind()}
function rebind(){W.querySelectorAll('.item').forEach(bind)}
function save(){localStorage.setItem(KEY,W.innerHTML);S.textContent='Saved ✓'}
function resetSaved(){snapshot();localStorage.removeItem(KEY);location.reload()}
function goHome(){location.href='./'}
document.addEventListener('keydown',e=>{if(!sel)return;if(e.key==='Delete')deleteSel();else if(e.key==='ArrowLeft'){e.preventDefault();move(-5,0)}else if(e.key==='ArrowRight'){e.preventDefault();move(5,0)}else if(e.key==='ArrowUp'){e.preventDefault();move(0,-5)}else if(e.key==='ArrowDown'){e.preventDefault();move(0,5)}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}})
let saved=localStorage.getItem(KEY);
if(saved){W.innerHTML=saved;rebind()}else{
let h=document.createElement('h1');h.textContent='SRIJA COMMUNICATION';h.contentEditable='true';bind(h);W.appendChild(h);
let p=document.createElement('p');p.textContent='শ্রীজা কমিউনিকেশন';p.contentEditable='true';bind(p);W.appendChild(p);
let n=document.createElement('div');n.textContent='চলমান লেখা';bind(n);W.appendChild(n);
}
</script><script id="SRIJA_ALL_PAGE_EDITOR_V1">(function(){if(!sessionStorage.getItem("srija_owner_logged_in"))return;function start(){if(window.srijaStartUnifiedEditor)try{window.srijaStartUnifiedEditor()}catch(e){}document.body.classList.add("srija-all-pages-editing");document.querySelectorAll("a").forEach(function(a){if(a.dataset.srijaEditBound)return;a.dataset.srijaEditBound="1";a.addEventListener("click",function(e){if(sessionStorage.getItem("srija_owner_logged_in")==="1"){e.preventDefault();e.stopImmediatePropagation();if(window.srijaStartUnifiedEditor)window.srijaStartUnifiedEditor();}},true)});document.querySelectorAll("img").forEach(function(i){i.style.touchAction="none"});var n=document.getElementById("srijaUnifiedEditor");if(!n&&window.srijaStartUnifiedEditor)window.srijaStartUnifiedEditor()}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);else setTimeout(start,50);})();</script>\n<script id="SRIJA_DIRECT_TOUCH_RESIZE_V1">(function(){if(!sessionStorage.getItem("srija_owner_logged_in"))return;var active=null,sx=0,sy=0,sl=0,st=0,sw=0,sh=0;function prep(){document.querySelectorAll("body *").forEach(function(el){if(el.id==="srijaUnifiedEditor"||el.closest("#srijaUnifiedEditor")||el.dataset.srijaDragBound)return;el.dataset.srijaDragBound="1";el.style.touchAction="none";el.addEventListener("pointerdown",function(e){if(e.button!==undefined&&e.button!==0)return;if(el.closest("button,input,select,textarea,a")&&!el.dataset.srijaEditable)return;active=el;sx=e.clientX;sy=e.clientY;var r=el.getBoundingClientRect();sl=r.left;st=r.top;sw=r.width;sh=r.height;try{el.setPointerCapture(e.pointerId)}catch(x){}},true);el.addEventListener("pointermove",function(e){if(active!==el)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)<3)return;if(el.tagName!=="IMG"&&el.dataset.srijaEditable!=="1"&&el.children.length===0&&el.textContent.trim()!=="")el.style.position="relative";if(el.style.position==="static"||!el.style.position)el.style.position="relative";el.style.left=(parseFloat(el.dataset.dragX)||0)+dx+"px";el.style.top=(parseFloat(el.dataset.dragY)||0)+dy+"px";el.dataset.dragX=(parseFloat(el.dataset.dragX)||0)+dx;el.dataset.dragY=(parseFloat(el.dataset.dragY)||0)+dy;sx=e.clientX;sy=e.clientY},true);el.addEventListener("pointerup",function(){if(active===el)active=null},true)});}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",prep);else setTimeout(prep,100);})();</script>\n<script id="SRIJA_PERSISTENT_PAGE_SAVE_V2">
(function(){
  "use strict";
  var key="srija_page_saved_"+location.pathname;
  function cleanHTML(){
    var b=document.body.cloneNode(true);
    ["srijaUnifiedEditor","srijaRibbonEditor","srijaLoginOverlay","srijaEmergencyLogin","srijaEditorPanel","srijaStandaloneLogin","adminPanel","srijaSettingsV3","loginBox"].forEach(function(id){var x=b.querySelector("#"+id);if(x)x.remove();});
    b.querySelectorAll("script").forEach(function(x){x.remove();});
    return b.innerHTML;
  }
  function restore(){
    try{
      var saved=localStorage.getItem(key);
      if(!saved)return;
      var tmp=document.createElement("div");tmp.innerHTML=saved;
      var old=document.body.innerHTML;
      document.body.innerHTML=saved;
      if(window.srijaStartUnifiedEditor&&sessionStorage.getItem("srija_owner_logged_in")==="1")setTimeout(window.srijaStartUnifiedEditor,20);
    }catch(e){}
  }
  function saveNow(){
    try{localStorage.setItem(key,cleanHTML());return true}catch(e){return false}
  }
  window.srijaPersistentSave=saveNow;
  window.srijaPersistentLoad=restore;
  try{restore()}catch(e){}
  document.addEventListener("click",function(e){
    var b=e.target&&e.target.closest?e.target.closest("button"):null;
    if(!b)return;
    if((b.textContent||"").trim()==="Save" && sessionStorage.getItem("srija_owner_logged_in")==="1"){
      setTimeout(function(){saveNow()},30);
    }
  },false);
})();
</script>\n<style id="SRIJA_COMPLETE_EDITOR_CSS_V2">
#srijaCompleteEditor{position:fixed;left:0;right:0;top:0;z-index:2147483647;background:#fff;border-bottom:2px solid #173b8f;box-shadow:0 3px 16px #0004;font-family:Arial,sans-serif}
#srijaCompleteEditor .cebar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;padding:7px;max-height:150px;overflow:auto}
#srijaCompleteEditor button,#srijaCompleteEditor select,#srijaCompleteEditor input{font-size:14px;padding:7px;border:1px solid #bbb;border-radius:6px;background:#fff}
#srijaCompleteEditor .ceinfo{font-size:12px;padding:2px 8px 7px}
.srija-ce-selected{outline:2px solid #1677ff!important;outline-offset:2px!important}
body.srija-complete-editing{padding-top:105px!important}
</style>
<script id="SRIJA_COMPLETE_EDITOR_V2">
(function(){
"use strict";
if(sessionStorage.getItem("srija_owner_logged_in")!=="1")return;
var sel=null,clip=null,hist=[],future=[],key="srija_complete_saved_"+location.pathname;
function ignore(e){return e.closest&&e.closest("#srijaCompleteEditor,#srijaUnifiedEditor,#srijaRibbonEditor")}
function select(el){if(!el||ignore(el))return;if(sel)sel.classList.remove("srija-ce-selected");sel=el;sel.classList.add("srija-ce-selected");}
function snap(){hist.push(document.body.innerHTML);if(hist.length>25)hist.shift();future=[]}
function bind(){
 document.querySelectorAll("body *").forEach(function(el){
  if(ignore(el)||el.dataset.ceBound)return;el.dataset.ceBound="1";
  el.addEventListener("pointerdown",function(e){if(ignore(e.target))return;e.preventDefault();e.stopPropagation();select(el)},true);
  el.addEventListener("dblclick",function(e){if(ignore(e.target))return;e.preventDefault();e.stopPropagation();select(el);if(el.tagName!=="IMG"){el.contentEditable="true";el.focus()}},true);
 });
}
function addText(){snap();var e=document.createElement("div");e.textContent="এখানে লেখা লিখুন";e.contentEditable="true";e.style.cssText="padding:10px;min-height:35px";document.body.appendChild(e);bind();select(e);e.focus()}
function addBox(){snap();var e=document.createElement("div");e.innerHTML="<strong>নতুন Box</strong><div>এখানে লেখা বা তথ্য দিন</div>";e.contentEditable="true";e.style.cssText="padding:18px;margin:12px;min-height:70px;border:2px solid #2457c5;border-radius:10px;background:#fff;resize:both;overflow:auto";document.body.appendChild(e);bind();select(e);e.focus()}
function addImage(){var i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=function(){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){snap();if(sel&&sel.tagName==="IMG")sel.src=r.result;else{var x=document.createElement("img");x.src=r.result;x.style.maxWidth="100%";x.style.display="block";document.body.appendChild(x);select(x)}bind();save()};r.readAsDataURL(f)};i.click()}
function style(k,v){if(!sel)return;snap();sel.style[k]=v}
function move(dx,dy){if(!sel)return;snap();if(getComputedStyle(sel).position==="static")sel.style.position="relative";sel.style.left=(parseInt(sel.style.left)||0)+dx+"px";sel.style.top=(parseInt(sel.style.top)||0)+dy+"px"}
function size(d){if(!sel)return;snap();var w=sel.getBoundingClientRect().width;sel.style.width=Math.max(40,w+d)+"px"}
function clean(){var b=document.body.cloneNode(true);["srijaCompleteEditor","srijaUnifiedEditor","srijaRibbonEditor","srijaLoginOverlay","srijaEmergencyLogin"].forEach(function(id){var x=b.querySelector("#"+id);if(x)x.remove()});b.querySelectorAll("script").forEach(function(x){x.remove()});b.querySelectorAll("[data-ce-bound]").forEach(function(x){x.removeAttribute("data-ce-bound")});return b.innerHTML}
function save(){try{localStorage.setItem(key,clean());localStorage.setItem("srija_last_saved_page",location.pathname);var st=document.getElementById("ceStatus");if(st)st.textContent="Saved ✓";}catch(e){alert("Save করা যায়নি")}}
function undo(){if(!hist.length)return;future.push(document.body.innerHTML);document.body.innerHTML=hist.pop();sel=null;bind();build()}
function redo(){if(!future.length)return;hist.push(document.body.innerHTML);document.body.innerHTML=future.pop();sel=null;bind();build()}
function build(){
 var old=document.getElementById("srijaCompleteEditor");if(old)old.remove();
 var p=document.createElement("div");p.id="srijaCompleteEditor";
 p.innerHTML='<div class="cebar"><b>SRIJA EDITOR</b><button data-a="text">+ Text</button><button data-a="box">+ Box</button><button data-a="img">+ Image</button><button data-a="bold"><b>B</b></button><button data-a="italic"><i>I</i></button><button data-a="under"><u>U</u></button><button data-a="left">Left</button><button data-a="center">Center</button><button data-a="right">Right</button><button data-a="smaller">A−</button><button data-a="larger">A+</button><select data-a="font"><option value="">Font</option><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Tahoma</option><option>Courier New</option></select><input data-a="color" type="color" title="Text color"><input data-a="bg" type="color" title="Background"><button data-a="minus">− Size</button><button data-a="plus">+ Size</button><button data-a="copy">Copy</button><button data-a="paste">Paste</button><button data-a="del">Delete</button><button data-a="undo">Undo</button><button data-a="redo">Redo</button><button data-a="save">SAVE</button><button data-a="home">Home</button><button data-a="logout">Logout</button><span id="ceStatus">Ready</span></div><div class="ceinfo">Click/Touch = select • Double-click = edit text • Drag/Arrow keys = move • Box/Image selected হলে size পরিবর্তন করুন</div>';
 document.body.appendChild(p);document.body.classList.add("srija-complete-editing");
 p.addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a;
 if(a==="text")return addText();if(a==="box")return addBox();if(a==="img")return addImage();if(a==="home")return location.href="./";if(a==="save")return save();if(a==="logout"){sessionStorage.clear();return location.reload()}
 if(a==="copy"){if(sel)clip=sel.cloneNode(true);return}if(a==="paste"){if(!clip||!sel)return;snap();var n=clip.cloneNode(true);n.removeAttribute("id");sel.parentNode.insertBefore(n,sel.nextSibling);bind();select(n);return}
 if(a==="del"){if(sel){snap();sel.remove();sel=null}return}if(a==="undo")return undo();if(a==="redo")return redo();if(!sel)return;
 if(a==="bold")return style("fontWeight",getComputedStyle(sel).fontWeight==="700"?"normal":"bold");
 if(a==="italic")return style("fontStyle",getComputedStyle(sel).fontStyle==="italic"?"normal":"italic");
 if(a==="under")return style("textDecoration",getComputedStyle(sel).textDecoration.includes("underline")?"none":"underline");
 if(["left","center","right"].includes(a))return style("textAlign",a);
 if(a==="smaller"||a==="larger"){var z=parseFloat(getComputedStyle(sel).fontSize)||16;return style("fontSize",Math.max(8,z+(a==="larger"?2:-2))+"px")}
 if(a==="minus")return size(-10);if(a==="plus")return size(10);
 if(a==="font"&&b.value)return style("fontFamily",b.value);
 if(a==="color")return style("color",b.value);if(a==="bg")return style("backgroundColor",b.value);
 });
}
document.addEventListener("keydown",function(e){if(!sel||e.target.closest&&e.target.closest("#srijaCompleteEditor"))return;if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();move(e.shiftKey?10:3,e.key==="ArrowLeft"?0:e.key==="ArrowRight"?0:e.key==="ArrowUp"?0:0);if(e.key==="ArrowLeft")move(-((e.shiftKey?10:3)*2),0);if(e.key==="ArrowRight")move(0,0);if(e.key==="ArrowUp")move(0,-(e.shiftKey?10:3));if(e.key==="ArrowDown")move(0,e.shiftKey?10:3)}});
function restore(){try{var s=localStorage.getItem(key);if(s){document.body.innerHTML=s}}catch(e){}}
restore();build();bind();
})();
</script>
</body></html>
