<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRIJA Visual Editor</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#eef2f7;color:#172033}#toolbar{position:fixed;top:0;left:0;right:0;z-index:999999;background:#fff;border-bottom:2px solid #173b8f;padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 12px #0003}#toolbar b{margin-right:8px}button{font-size:14px;padding:9px 12px;border:1px solid #999;border-radius:6px;background:#fff;cursor:pointer!important}#status{padding:7px;font-size:13px}.wrap{padding:145px 12px 30px}#canvas{max-width:1100px;margin:auto;background:#fff;min-height:70vh;padding:28px;border-radius:10px;box-shadow:0 2px 12px #0001}.picked{outline:3px solid #1677ff!important;outline-offset:2px}#error{display:none;margin:12px auto;padding:14px;max-width:1100px;background:#fff0f0;border:2px solid #c00;color:#900}</style></head><body><div id="toolbar"><b>SRIJA EDITOR</b><button data-a="text">＋ Text</button><button data-a="box">＋ Box</button><button data-a="image">＋ Image / Logo</button><button data-a="bold">B</button><button data-a="italic">I</button><button data-a="under">U</button><button data-a="left">Left</button><button data-a="center">Center</button><button data-a="right">Right</button><button data-a="smaller">A−</button><button data-a="larger">A+</button><button data-a="up">↑</button><button data-a="leftmove">←</button><button data-a="rightmove">→</button><button data-a="down">↓</button><button data-a="copy">Copy</button><button data-a="paste">Paste</button><button data-a="delete">Delete</button><button data-a="undo">Undo</button><button data-a="redo">Redo</button><button data-a="save">SAVE</button><button data-a="home">Home</button><button data-a="logout">Logout</button><span id="status">কোনও অংশ নির্বাচিত নয়</span></div><div class="wrap"><div id="error"></div><main id="canvas"><h1>SRIJA COMMUNICATION</h1><p>শ্রীজা কমিউনিকেশন</p><div>চলমান লেখা</div><p>Editor প্রস্তুত — উপরের বাটন থেকে লেখা, Box বা ছবি যোগ করুন।</p></main></div><script>(function(){var canvas=document.getElementById("canvas"),status=document.getElementById("status"),error=document.getElementById("error"),selected=null,clip=null,hist=[],future=[];function fail(e){error.style.display="block";error.textContent="Editor ত্রুটি: "+(e&&e.message?e.message:e)}window.addEventListener("error",function(e){fail(e.error||e.message)});function clear(){canvas.querySelectorAll(".picked").forEach(function(x){x.classList.remove("picked")});selected=null;status.textContent="কোনও অংশ নির্বাচিত নয়"}function pick(el){if(!el||!el.parentNode)return;clear();selected=el;selected.classList.add("picked");status.textContent="নির্বাচিত: "+((selected.innerText||selected.tagName).trim().slice(0,30))}function bind(){canvas.querySelectorAll("*").forEach(function(el){el.onpointerdown=function(e){e.stopPropagation();pick(el)};el.ondblclick=function(e){e.stopPropagation();pick(el);if(el.tagName!=="IMG"){el.contentEditable="true";el.focus()}}})}function snap(){hist.push(canvas.innerHTML);if(hist.length>30)hist.shift();future=[]}function move(x,y){if(!selected)return;snap();selected.style.position="relative";selected.style.left=((parseInt(selected.style.left)||0)+x)+"px";selected.style.top=((parseInt(selected.style.top)||0)+y)+"px"}function act(a){try{if(a==="text"){snap();var t=document.createElement("p");t.textContent="নতুন লেখা";canvas.appendChild(t);bind();pick(t);t.contentEditable="true";t.focus();return}if(a==="box"){snap();var b=document.createElement("div");b.textContent="নতুন Box";b.style.cssText="padding:20px;margin:12px 0;border:2px solid #2457c5;border-radius:10px;min-height:70px;resize:both;overflow:auto";canvas.appendChild(b);bind();pick(b);return}if(a==="image"){var f=document.createElement("input");f.type="file";f.accept="image/*";f.onchange=function(){var file=f.files&&f.files[0];if(!file)return;var r=new FileReader();r.onload=function(){snap();var im=document.createElement("img");im.src=r.result;im.alt="Logo / ছবি";im.style.cssText="max-width:220px;max-height:160px;display:block;margin:12px auto;object-fit:contain";canvas.appendChild(im);bind();pick(im)};r.readAsDataURL(file)};f.click();return}if(a==="home"){location.href="./";return}if(a==="logout"){sessionStorage.clear();location.href="./";return}if(!selected)return;if(a==="bold"){snap();selected.style.fontWeight=getComputedStyle(selected).fontWeight==="700"?"normal":"bold"}else if(a==="italic"){snap();selected.style.fontStyle=getComputedStyle(selected).fontStyle==="italic"?"normal":"italic"}else if(a==="under"){snap();selected.style.textDecoration=getComputedStyle(selected).textDecoration.includes("underline")?"none":"underline"}else if(a==="left"||a==="center"||a==="right"){snap();selected.style.textAlign=a}else if(a==="smaller"||a==="larger"){snap();var n=parseFloat(getComputedStyle(selected).fontSize)||16;selected.style.fontSize=Math.max(8,n+(a==="larger"?2:-2))+"px"}else if(a==="up")move(0,-5);else if(a==="down")move(0,5);else if(a==="leftmove")move(-5,0);else if(a==="rightmove")move(5,0);else if(a==="copy")clip=selected.cloneNode(true);else if(a==="paste"){if(!clip)return;snap();var q=clip.cloneNode(true);q.classList.remove("picked");selected.after(q);bind()}else if(a==="delete"){snap();selected.remove();clear()}else if(a==="undo"){if(hist.length){future.push(canvas.innerHTML);canvas.innerHTML=hist.pop();bind();clear()}}else if(a==="redo"){if(future.length){hist.push(canvas.innerHTML);canvas.innerHTML=future.pop();bind();clear()}}else if(a==="save"){localStorage.setItem("srija_editor_page_v8",canvas.innerHTML);status.textContent="Save হয়েছে ✓"}}catch(e){fail(e)}}document.querySelectorAll("#toolbar button").forEach(function(b){b.addEventListener("click",function(e){e.preventDefault();e.stopPropagation();act(b.getAttribute("data-a"))})});canvas.addEventListener("pointerdown",function(e){if(e.target===canvas)clear()});document.addEventListener("keydown",function(e){if(!selected||e.target.closest("#toolbar"))return;var d=e.shiftKey?10:3;if(e.key==="ArrowLeft")move(-d,0);else if(e.key==="ArrowRight")move(d,0);else if(e.key==="ArrowUp")move(0,-d);else if(e.key==="ArrowDown")move(0,d)});try{var saved=localStorage.getItem("srija_editor_page_v8");if(saved&&saved.replace(/\s/g,"").length>50&&saved.indexOf("<")>=0&&saved.indexOf("</")>=0)canvas.innerHTML=saved}catch(e){localStorage.removeItem("srija_editor_page_v8")}bind();clear()})();</script></body></html>
